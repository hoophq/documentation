<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img" aria-label="Network map: clients reach Sidecar listeners on local ports or a unix socket; each listener forwards to one upstream resource; the Sidecar makes one outbound HTTPS connection to the Control Plane, which connects to PostgreSQL on 5432.">
        <defs>
          <marker id="lm1-ink" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto">
            <polygon points="0,0 10,4 0,8" fill="#0F1631"/>
          </marker>
          <marker id="lm1-plane" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="8" orient="auto">
            <polygon points="0,0 10,4 0,8" fill="#3E63DD"/>
          </marker>
          <marker id="lm1-data" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto">
            <polygon points="0,0 10,4 0,8" fill="#0F1631"/>
          </marker>
          <marker id="lm1-muted" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto">
            <polygon points="0,0 10,4 0,8" fill="#5A6178"/>
          </marker>
        </defs>

        <!-- zones -->
        <rect x="20" y="88" width="540" height="470" fill="none" stroke="#CDCFD7"/>
        <text x="36" y="112" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5A6178">Workload network</text>

        <rect x="620" y="88" width="360" height="470" fill="none" stroke="#CDCFD7"/>
        <text x="636" y="112" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5A6178">Control Plane network</text>

        <!-- outbound trunk -->
        <polyline points="290,140 290,54 600,54 600,242 644,242" fill="none" stroke="#3E63DD" stroke-width="2.4" marker-end="url(#lm1-plane)"/>
        <text x="306" y="32" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#3A5BC7">outbound HTTPS — the only arrow that leaves</text>
        <text x="306" y="48" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5A6178">:8009 or :443 · handshake at boot, heartbeat every 60s</text>

        <!-- client -->
        <rect x="34" y="252" width="130" height="62" fill="#ECEEF4" stroke="none"/>
        <text x="99" y="278" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F1631">Application</text>
        <text x="99" y="296" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5A6178">psql · curl · driver</text>

        <!-- sidecar process -->
        <rect x="190" y="140" width="212" height="332" fill="none" stroke="#CDCFD7"/>
        <text x="204" y="164" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0F1631">Sidecar process</text>
        <text x="204" y="180" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5A6178">one binary · one config file</text>

        <rect x="202" y="192" width="188" height="56" fill="#ECEEF4" stroke="none"/>
        <text x="212" y="212" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0F1631">appdb · postgres</text>
        <text x="212" y="232" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#5A6178">tcp 0.0.0.0:15432</text>

        <rect x="202" y="256" width="188" height="56" fill="#ECEEF4" stroke="none"/>
        <text x="212" y="276" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0F1631">mssqldb · mssql</text>
        <text x="212" y="296" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#5A6178">tcp 0.0.0.0:11433</text>

        <rect x="202" y="320" width="188" height="56" fill="#ECEEF4" stroke="none"/>
        <text x="212" y="340" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0F1631">billing · http</text>
        <text x="212" y="360" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#5A6178">unix /run/hoop/http.sock</text>

        <rect x="202" y="392" width="188" height="56" fill="none" stroke="#CDCFD7" stroke-dasharray="3 3"/>
        <text x="212" y="412" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#5A6178">admin · read-only API</text>
        <text x="212" y="432" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#5A6178">tcp 127.0.0.1:19000</text>

        <!-- client arrows -->
        <line x1="164" y1="272" x2="198" y2="220" stroke="#0F1631" stroke-width="1.4" marker-end="url(#lm1-ink)"/>
        <line x1="164" y1="283" x2="198" y2="284" stroke="#0F1631" stroke-width="1.4" marker-end="url(#lm1-ink)"/>
        <line x1="164" y1="294" x2="198" y2="348" stroke="#0F1631" stroke-width="1.4" marker-end="url(#lm1-ink)"/>

        <!-- upstreams -->
        <rect x="438" y="192" width="106" height="56" fill="#ECEEF4" stroke="none"/>
        <text x="491" y="214" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#0F1631">appdb:5432</text>
        <text x="491" y="232" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#5A6178">pgwire</text>

        <rect x="438" y="256" width="106" height="56" fill="#ECEEF4" stroke="none"/>
        <text x="491" y="278" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#0F1631">mssql:1433</text>
        <text x="491" y="296" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#5A6178">TDS</text>

        <rect x="438" y="320" width="106" height="56" fill="#ECEEF4" stroke="none"/>
        <text x="491" y="342" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#0F1631">billing:8080</text>
        <text x="491" y="360" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#5A6178">HTTP</text>

        <line x1="392" y1="220" x2="434" y2="220" stroke="#5A6178" stroke-width="1.6" marker-end="url(#lm1-ink)"/>
        <line x1="392" y1="284" x2="434" y2="284" stroke="#5A6178" stroke-width="1.6" marker-end="url(#lm1-ink)"/>
        <line x1="392" y1="348" x2="434" y2="348" stroke="#5A6178" stroke-width="1.6" marker-end="url(#lm1-ink)"/>

        <text x="40" y="512" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0F1631">One listener per upstream, all in one process.</text>
        <text x="40" y="532" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#5A6178">Nothing in this zone ever accepts a connection from the Control Plane.</text>

        <!-- browser + idp -->
        <rect x="644" y="132" width="146" height="48" fill="#ECEEF4" stroke="none"/>
        <text x="717" y="153" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0F1631">Browser</text>
        <text x="717" y="169" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5A6178">web app · HTTPS</text>

        <rect x="812" y="132" width="146" height="48" fill="none" stroke="#CDCFD7" stroke-dasharray="3 3"/>
        <text x="885" y="153" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#5A6178">Identity provider</text>
        <text x="885" y="169" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5A6178">OIDC / SAML · optional</text>

        <line x1="717" y1="180" x2="717" y2="216" stroke="#0F1631" stroke-width="1.4" marker-end="url(#lm1-ink)"/>
        <line x1="885" y1="180" x2="885" y2="216" stroke="#5A6178" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#lm1-muted)"/>

        <!-- control plane -->
        <rect x="644" y="218" width="314" height="76" fill="#ECEEF4" stroke="#3E63DD" stroke-width="2"/>
        <text x="801" y="248" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0F1631">Control Plane</text>
        <text x="801" y="270" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#5A6178">:8009 · one HTTP port · holds no session</text>

        <!-- cp to db -->
        <line x1="801" y1="294" x2="801" y2="384" stroke="#0F1631" stroke-width="2.2" marker-end="url(#lm1-data)"/>
        <text x="814" y="326" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#0F1631">TCP 5432</text>
        <text x="814" y="344" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5A6178">required at startup</text>

        <!-- database -->
        <path d="M644 400 a157 16 0 0 1 314 0 v60 a157 16 0 0 1 -314 0 z" fill="#ECEEF4" stroke="#5A6178" stroke-width="1.5"/>
        <path d="M644 400 a157 16 0 0 0 314 0" fill="none" stroke="#5A6178" stroke-width="1.5"/>
        <text x="801" y="438" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0F1631">PostgreSQL</text>
        <text x="801" y="457" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5A6178">all Control Plane state</text>

        <text x="644" y="512" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0F1631">Two endpoints to reach.</text>
        <text x="644" y="532" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#5A6178">Its database, and whatever address you publish it on.</text>
      </svg>
