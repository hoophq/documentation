<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 342" role="img" aria-label="Sequence: the Sidecar sends a handshake with its token, receives its configuration, loads it and binds listeners, then repeats a heartbeat every 60 seconds. The Control Plane never initiates.">
        <defs>
          <marker id="dm2-ink" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto">
            <polygon points="0,0 10,4 0,8" fill="#e4e9ef"/>
          </marker>
          <marker id="dm2-plane" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto">
            <polygon points="0,0 10,4 0,8" fill="#e2a25d"/>
          </marker>
        </defs>

        <rect x="70" y="18" width="160" height="42" fill="#151a21" stroke="#a9b8c8" stroke-width="1.6"/>
        <text x="150" y="45" text-anchor="middle" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e4e9ef">Sidecar</text>

        <rect x="500" y="18" width="180" height="42" fill="#151a21" stroke="#e2a25d" stroke-width="1.6"/>
        <text x="590" y="45" text-anchor="middle" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e4e9ef">Control Plane</text>

        <line x1="150" y1="60" x2="150" y2="320" stroke="#3b4754" stroke-dasharray="4 5"/>
        <line x1="590" y1="60" x2="590" y2="320" stroke="#3b4754" stroke-dasharray="4 5"/>

        <line x1="150" y1="92" x2="584" y2="92" stroke="#e2a25d" stroke-width="1.8" marker-end="url(#dm2-plane)"/>
        <text x="368" y="84" text-anchor="middle" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="11.5" fill="#e4e9ef">handshake · token</text>

        <line x1="590" y1="126" x2="156" y2="126" stroke="#e2a25d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#dm2-plane)"/>
        <text x="368" y="118" text-anchor="middle" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="11.5" fill="#e4e9ef">configuration</text>

        <polyline points="150,152 206,152 206,176 156,176" fill="none" stroke="#e4e9ef" stroke-width="1.4" marker-end="url(#dm2-ink)"/>
        <text x="218" y="169" font-family="IBM Plex Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#98a4b2">load into memory, bind listeners, serve traffic</text>

        <rect x="104" y="204" width="576" height="94" fill="none" stroke="#3b4754" stroke-dasharray="3 4"/>
        <rect x="104" y="204" width="86" height="20" fill="#1c232b" stroke="#3b4754"/>
        <text x="147" y="219" text-anchor="middle" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="11" fill="#98a4b2">every 60s</text>

        <line x1="150" y1="248" x2="584" y2="248" stroke="#e2a25d" stroke-width="1.8" marker-end="url(#dm2-plane)"/>
        <text x="368" y="240" text-anchor="middle" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="11.5" fill="#e4e9ef">heartbeat · token</text>

        <line x1="590" y1="282" x2="156" y2="282" stroke="#e2a25d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#dm2-plane)"/>
        <text x="368" y="274" text-anchor="middle" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="11.5" fill="#e4e9ef">current configuration</text>

        <text x="104" y="330" font-family="IBM Plex Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#98a4b2">Every arrow starts on the left. The Control Plane has no way to reach a Sidecar and never tries.</text>
      </svg>
