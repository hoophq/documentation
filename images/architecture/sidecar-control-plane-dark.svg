<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 342" role="img" aria-label="Sequence: the Sidecar sends a handshake with its token, receives its configuration, loads it and binds listeners, then repeats a heartbeat every 60 seconds. The Control Plane never initiates.">
        <defs>
          <marker id="lm2-ink" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto">
            <polygon points="0,0 10,4 0,8" fill="#F7F8FB"/>
          </marker>
          <marker id="lm2-plane" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto">
            <polygon points="0,0 10,4 0,8" fill="#3E63DD"/>
          </marker>
        </defs>

        <rect x="70" y="18" width="160" height="42" fill="rgba(247,248,251,0.08)" stroke="none"/>
        <text x="150" y="45" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#F7F8FB">Sidecar</text>

        <rect x="500" y="18" width="180" height="42" fill="rgba(247,248,251,0.08)" stroke="#3E63DD" stroke-width="1.6"/>
        <text x="590" y="45" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#F7F8FB">Control Plane</text>

        <line x1="150" y1="60" x2="150" y2="320" stroke="rgba(247,248,251,0.2)" stroke-dasharray="4 5"/>
        <line x1="590" y1="60" x2="590" y2="320" stroke="rgba(247,248,251,0.2)" stroke-dasharray="4 5"/>

        <line x1="150" y1="92" x2="584" y2="92" stroke="#3E63DD" stroke-width="1.8" marker-end="url(#lm2-plane)"/>
        <text x="368" y="84" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#F7F8FB">handshake · token</text>

        <line x1="590" y1="126" x2="156" y2="126" stroke="#3E63DD" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#lm2-plane)"/>
        <text x="368" y="118" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#F7F8FB">configuration</text>

        <polyline points="150,152 206,152 206,176 156,176" fill="none" stroke="#F7F8FB" stroke-width="1.4" marker-end="url(#lm2-ink)"/>
        <text x="218" y="169" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#B1B4BE">load into memory, bind listeners, serve traffic</text>

        <rect x="104" y="204" width="576" height="94" fill="none" stroke="rgba(247,248,251,0.2)" stroke-dasharray="3 4"/>
        <rect x="104" y="204" width="86" height="20" fill="rgba(247,248,251,0.08)" stroke="none"/>
        <text x="147" y="219" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#B1B4BE">every 60s</text>

        <line x1="150" y1="248" x2="584" y2="248" stroke="#3E63DD" stroke-width="1.8" marker-end="url(#lm2-plane)"/>
        <text x="368" y="240" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#F7F8FB">heartbeat · token</text>

        <line x1="590" y1="282" x2="156" y2="282" stroke="#3E63DD" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#lm2-plane)"/>
        <text x="368" y="274" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#F7F8FB">current configuration</text>

        <text x="104" y="330" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#B1B4BE">Every arrow starts on the left. The Control Plane has no way to reach a Sidecar and never tries.</text>
      </svg>
