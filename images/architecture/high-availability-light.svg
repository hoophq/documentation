<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 592" role="img" aria-label="Scaling diagram: the Sidecar tier runs multiple independent replicas behind a Service, each forwarding to the protected resource and each dialling the Control Plane. The Control Plane tier runs stateless replicas behind a load balancer, all writing to one PostgreSQL primary with a standby for failover.">
        <defs>
          <marker id="lm3-ink" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto">
            <polygon points="0,0 10,4 0,8" fill="#0F1631"/>
          </marker>
          <marker id="lm3-plane" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="8" orient="auto">
            <polygon points="0,0 10,4 0,8" fill="#3E63DD"/>
          </marker>
          <marker id="lm3-data" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto">
            <polygon points="0,0 10,4 0,8" fill="#8DA4EF"/>
          </marker>
          <marker id="lm3-res" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto">
            <polygon points="0,0 10,4 0,8" fill="#1F2D5C"/>
          </marker>
        </defs>

        <!-- panels -->
        <rect x="20" y="72" width="450" height="500" fill="none" stroke="#CDCFD7"/>
        <text x="36" y="100" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0F1631">Data plane · Sidecar tier</text>
        <text x="36" y="118" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#5A6178">scales with concurrent connections</text>

        <rect x="520" y="72" width="460" height="500" fill="none" stroke="#CDCFD7"/>
        <text x="536" y="100" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0F1631">Management · Control Plane tier</text>
        <text x="536" y="118" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#5A6178">stateless HTTP over a shared database</text>

        <!-- trunk: sidecar tier out to the load balancer -->
        <polyline points="472,302 496,302 496,50 786,50 786,142" fill="none" stroke="#3E63DD" stroke-width="2.2" marker-end="url(#lm3-plane)"/>
        <text x="512" y="34" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#3A5BC7">every replica dials out on its own — outbound HTTPS, every 60s</text>

        <!-- LEFT: clients -->
        <rect x="168" y="136" width="140" height="44" fill="#ECEEF4" stroke="none"/>
        <text x="238" y="163" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0F1631">Clients</text>
        <line x1="238" y1="180" x2="238" y2="196" stroke="#0F1631" stroke-width="1.4" marker-end="url(#lm3-ink)"/>

        <rect x="143" y="200" width="190" height="44" fill="#ECEEF4" stroke="none"/>
        <text x="238" y="220" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0F1631">Service / load balancer</text>
        <text x="238" y="236" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5A6178">spreads connections</text>

        <!-- replica group -->
        <rect x="30" y="262" width="442" height="84" fill="none" stroke="#CDCFD7" stroke-dasharray="3 4"/>
        <line x1="180" y1="244" x2="106" y2="268" stroke="#0F1631" stroke-width="1.4" marker-end="url(#lm3-ink)"/>
        <line x1="238" y1="244" x2="238" y2="268" stroke="#0F1631" stroke-width="1.4" marker-end="url(#lm3-ink)"/>
        <line x1="296" y1="244" x2="370" y2="268" stroke="#0F1631" stroke-width="1.4" marker-end="url(#lm3-ink)"/>

        <rect x="42" y="272" width="128" height="64" fill="#ECEEF4" stroke="none"/>
        <text x="106" y="298" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0F1631">Sidecar</text>
        <text x="106" y="316" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5A6178">replica 1</text>

        <rect x="187" y="272" width="128" height="64" fill="#ECEEF4" stroke="none"/>
        <text x="251" y="298" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0F1631">Sidecar</text>
        <text x="251" y="316" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5A6178">replica 2</text>

        <rect x="332" y="272" width="128" height="64" fill="#ECEEF4" stroke="none"/>
        <text x="396" y="298" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0F1631">Sidecar</text>
        <text x="396" y="316" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5A6178">replica n</text>

        <!-- to resource -->
        <line x1="106" y1="346" x2="196" y2="404" stroke="#1F2D5C" stroke-width="1.5" marker-end="url(#lm3-res)"/>
        <line x1="251" y1="346" x2="251" y2="404" stroke="#1F2D5C" stroke-width="1.5" marker-end="url(#lm3-res)"/>
        <line x1="396" y1="346" x2="306" y2="404" stroke="#1F2D5C" stroke-width="1.5" marker-end="url(#lm3-res)"/>

        <rect x="151" y="408" width="200" height="56" fill="#ECEEF4" stroke="#1F2D5C" stroke-width="1.8"/>
        <text x="251" y="432" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0F1631">Protected resource</text>
        <text x="251" y="450" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5A6178">appdb:5432</text>

        <rect x="36" y="492" width="4" height="52" fill="#0F1631"/>
        <text x="52" y="508" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0F1631">Raising replicas is safe.</text>
        <text x="52" y="526" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#5A6178">No shared state. Sessions are per-connection, so a replica</text>
        <text x="52" y="542" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#5A6178">going away drops only the connections it was carrying.</text>

        <!-- RIGHT: browser + LB -->
        <rect x="536" y="142" width="130" height="44" fill="#ECEEF4" stroke="none"/>
        <text x="601" y="169" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0F1631">Browser</text>
        <line x1="666" y1="164" x2="702" y2="164" stroke="#0F1631" stroke-width="1.4" marker-end="url(#lm3-ink)"/>

        <rect x="706" y="142" width="160" height="44" fill="#ECEEF4" stroke="none"/>
        <text x="786" y="162" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0F1631">Load balancer</text>
        <text x="786" y="178" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5A6178">:443 → :8009</text>

        <line x1="760" y1="186" x2="676" y2="222" stroke="#3E63DD" stroke-width="1.5" marker-end="url(#lm3-plane)"/>
        <line x1="812" y1="186" x2="896" y2="222" stroke="#3E63DD" stroke-width="1.5" marker-end="url(#lm3-plane)"/>

        <rect x="586" y="226" width="180" height="62" fill="#ECEEF4" stroke="#3E63DD" stroke-width="1.8"/>
        <text x="676" y="252" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0F1631">Control Plane</text>
        <text x="676" y="270" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5A6178">replica 1</text>

        <rect x="806" y="226" width="180" height="62" fill="#ECEEF4" stroke="#3E63DD" stroke-width="1.8"/>
        <text x="896" y="252" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0F1631">Control Plane</text>
        <text x="896" y="270" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5A6178">replica 2</text>

        <line x1="676" y1="288" x2="676" y2="348" stroke="#8DA4EF" stroke-width="1.6" marker-end="url(#lm3-data)"/>
        <line x1="896" y1="288" x2="736" y2="348" stroke="#8DA4EF" stroke-width="1.6" marker-end="url(#lm3-data)"/>
        <text x="690" y="322" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#0F1631">writes</text>

        <path d="M586 352 a90 14 0 0 1 180 0 v46 a90 14 0 0 1 -180 0 z" fill="#E6EDFE" stroke="#8DA4EF" stroke-width="1.8"/>
        <path d="M586 352 a90 14 0 0 0 180 0" fill="none" stroke="#8DA4EF" stroke-width="1.8"/>
        <text x="676" y="382" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0F1631">PostgreSQL</text>
        <text x="676" y="399" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5A6178">primary</text>

        <path d="M806 352 a90 14 0 0 1 180 0 v46 a90 14 0 0 1 -180 0 z" fill="none" stroke="#8DA4EF" stroke-width="1.5" stroke-dasharray="4 3"/>
        <path d="M806 352 a90 14 0 0 0 180 0" fill="none" stroke="#8DA4EF" stroke-width="1.5" stroke-dasharray="4 3"/>
        <text x="896" y="382" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#5A6178">PostgreSQL</text>
        <text x="896" y="399" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5A6178">standby</text>

        <line x1="770" y1="376" x2="802" y2="376" stroke="#8DA4EF" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#lm3-data)"/>
        <text x="786" y="432" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#0F1631">replication</text>
        <line x1="786" y1="418" x2="786" y2="404" stroke="#8DA4EF" stroke-width="1" stroke-dasharray="2 2"/>

        <text x="536" y="456" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0F1631">The only stateful component in the deployment.</text>
        <text x="536" y="474" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#5A6178">Failover is your database's job, not the Control Plane's.</text>

        <rect x="536" y="492" width="4" height="52" fill="#3E63DD"/>
        <text x="552" y="508" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0F1631">Replicas need no coordination.</text>
        <text x="552" y="526" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#5A6178">No leader election, no sticky sessions, nothing to share in</text>
        <text x="552" y="542" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#5A6178">process — the database is all they have in common.</text>
      </svg>
