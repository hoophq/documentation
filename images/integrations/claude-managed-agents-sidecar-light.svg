<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 1000 470" role="img" aria-label="Claude Managed Agents with the Hoop Sidecar: the agent in a cloud sandbox sends HTTPS requests through Anthropic's egress proxy, which allows only the Sidecar's host and fills the vault's real tokens into request headers toward that host. The Sidecar in your network checks the caller token, refuses writes, masks emails and phone numbers in responses and records each request, then forwards to the REST API. Any other host, the API's own included, fails at DNS in the sandbox.">
        <defs>
          <marker id="cma-ink" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto">
            <polygon points="0,0 10,4 0,8" fill="#10151b"/>
          </marker>
          <marker id="cma-data" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto">
            <polygon points="0,0 10,4 0,8" fill="#3c6a1e"/>
          </marker>
          <marker id="cma-api" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto">
            <polygon points="0,0 10,4 0,8" fill="#1d4e79"/>
          </marker>
          <marker id="cma-muted" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto">
            <polygon points="0,0 10,4 0,8" fill="#8b96a3"/>
          </marker>
        </defs>

        <!-- zones -->
        <rect x="20" y="60" width="380" height="440" fill="#e9edf1" stroke="#b3bfc9" stroke-dasharray="3 4"/>
        <text x="36" y="84" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="11.5" fill="#5a6673" letter-spacing="1.2">ANTHROPIC · MANAGED AGENTS</text>
        <rect x="440" y="60" width="540" height="440" fill="#e9edf1" stroke="#b3bfc9" stroke-dasharray="3 4"/>
        <text x="456" y="84" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="11.5" fill="#5a6673" letter-spacing="1.2">YOUR NETWORK</text>

        <!-- sandbox -->
        <rect x="36" y="120" width="160" height="64" fill="#ffffff" stroke="#b3bfc9"/>
        <text x="116" y="143" text-anchor="middle" font-family="IBM Plex Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#10151b">Cloud sandbox</text>
        <text x="116" y="160" text-anchor="middle" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="10.5" fill="#5a6673">agent · bash · curl</text>
        <text x="116" y="175" text-anchor="middle" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="10.5" fill="#5a6673">vault placeholders</text>
        <line x1="196" y1="152" x2="216" y2="152" stroke="#10151b" stroke-width="1.4" marker-end="url(#cma-ink)"/>

        <!-- egress proxy -->
        <rect x="220" y="120" width="164" height="64" fill="#ffffff" stroke="#b3bfc9"/>
        <text x="302" y="143" text-anchor="middle" font-family="IBM Plex Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#10151b">Egress proxy</text>
        <text x="302" y="160" text-anchor="middle" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="10.5" fill="#5a6673">allowed_hosts:</text>
        <text x="302" y="175" text-anchor="middle" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="10.5" fill="#5a6673">the Sidecar's host only</text>

        <!-- vault -->
        <rect x="220" y="224" width="164" height="56" fill="#ffffff" stroke="#b3bfc9"/>
        <text x="302" y="247" text-anchor="middle" font-family="IBM Plex Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#10151b">Vault</text>
        <text x="302" y="265" text-anchor="middle" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="10.5" fill="#5a6673">tokens for that host</text>
        <line x1="302" y1="224" x2="302" y2="188" stroke="#10151b" stroke-width="1.4" marker-end="url(#cma-ink)"/>
        <text x="310" y="210" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="10.5" fill="#5a6673">fills headers</text>

        <!-- inspected path -->
        <line x1="384" y1="152" x2="486" y2="152" stroke="#3c6a1e" stroke-width="2.2" marker-end="url(#cma-data)"/>
        <text x="446" y="142" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="11" fill="#3c6a1e">HTTPS</text>

        <!-- sidecar -->
        <rect x="490" y="104" width="240" height="272" fill="#ffffff" stroke="#3b4756" stroke-width="1.6"/>
        <text x="504" y="128" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#10151b">Hoop Sidecar</text>
        <text x="504" y="144" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="10.5" fill="#5a6673">one http lane · :443</text>
        <rect x="502" y="156" width="216" height="46" fill="#e9edf1" stroke="#b3bfc9"/>
        <text x="512" y="175" font-family="IBM Plex Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#10151b">Caller token</text>
        <text x="512" y="192" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="10.5" fill="#5a6673">X-Hoop-Token · checked first</text>
        <rect x="502" y="208" width="216" height="46" fill="#e9edf1" stroke="#b3bfc9"/>
        <text x="512" y="227" font-family="IBM Plex Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#10151b">Guardrails</text>
        <text x="512" y="244" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="10.5" fill="#5a6673">read-only: GET · HEAD · OPTIONS</text>
        <rect x="502" y="260" width="216" height="46" fill="#e9edf1" stroke="#b3bfc9"/>
        <text x="512" y="279" font-family="IBM Plex Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#10151b">Data Masking</text>
        <text x="512" y="296" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="10.5" fill="#5a6673">emails · phones in responses</text>
        <rect x="502" y="312" width="216" height="46" fill="#e9edf1" stroke="#b3bfc9"/>
        <text x="512" y="331" font-family="IBM Plex Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#10151b">Audit</text>
        <text x="512" y="348" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="10.5" fill="#5a6673">each request · session id</text>

        <!-- api -->
        <line x1="730" y1="230" x2="776" y2="230" stroke="#1d4e79" stroke-width="2" marker-end="url(#cma-api)"/>
        <rect x="780" y="200" width="184" height="60" fill="#ffffff" stroke="#1d4e79" stroke-width="1.6"/>
        <text x="872" y="225" text-anchor="middle" font-family="IBM Plex Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#10151b">REST API</text>
        <text x="872" y="243" text-anchor="middle" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="10.5" fill="#5a6673">gets Authorization as sent</text>

        <!-- refused path -->
        <line x1="116" y1="184" x2="116" y2="366" stroke="#8b96a3" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#cma-muted)"/>
        <text x="124" y="300" font-family="IBM Plex Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5a6673">fails at DNS</text>
        <rect x="36" y="370" width="160" height="52" fill="none" stroke="#8b96a3" stroke-dasharray="3 3"/>
        <text x="116" y="393" text-anchor="middle" font-family="IBM Plex Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#5a6673">Any other host</text>
        <text x="116" y="410" text-anchor="middle" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="10.5" fill="#8b96a3">the API's own host too</text>

        <!-- notes -->
        <text x="36" y="462" font-family="IBM Plex Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#10151b">Only the Sidecar's host resolves.</text>
        <text x="36" y="480" font-family="IBM Plex Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5a6673">The sandbox holds vault placeholders, not tokens.</text>
        <text x="456" y="462" font-family="IBM Plex Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#10151b">A request without the caller token reaches no API.</text>
        <text x="456" y="480" font-family="IBM Plex Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5a6673">Writes get 403. Responses come back masked.</text>
      </svg>
